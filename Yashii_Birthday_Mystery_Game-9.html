<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yashii's Birthday Mystery 🎁</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#2b1748,#100b1c 65%);color:#fff;display:flex;justify-content:center;align-items:center;padding:20px}
.game{width:min(560px,100%);text-align:center}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.badge{font-size:13px;opacity:.7;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(30px,8vw,48px);margin:10px 0}
h2{font-size:clamp(23px,6vw,34px);line-height:1.2}
p{line-height:1.65;color:#ddd}
button{width:100%;min-height:52px;margin:8px 0;border:1px solid rgba(255,255,255,.18);border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer;transition:.18s;padding:12px 16px}
button:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.primary{background:#e8b6ff;color:#21102e;font-weight:800;border:0}
.progress{height:6px;background:rgba(255,255,255,.12);border-radius:20px;margin:0 0 24px;overflow:hidden}
.bar{height:100%;background:#e8b6ff;transition:.35s}
.screen{animation:appear .35s ease}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.photo{width:190px;height:190px;object-fit:cover;border-radius:50%;border:5px solid rgba(255,255,255,.8);margin:10px auto 20px;display:block}
.name{font-size:52px;margin:4px 0 10px}
.confetti{font-size:30px;letter-spacing:8px;margin:16px 0}
.small{font-size:13px;opacity:.6}
</style>
</head>
<body>
<main class="game">
<div class="card"><div id="screen" class="screen"></div></div>
</main>
<script>
const questions=[
{title:"The Birthday Door 🔐",text:"A mysterious door has appeared. Which one do you open?",options:["The door with ✨ lights","The door marked 👀","The completely suspicious one 🚪"]},
{title:"Question 2 🧩",text:"Choose your ideal birthday mode:",options:["Peace + good food 🍰","Laughing until it hurts 😂","A surprise I definitely didn't see coming 🎁"]},
{title:"Question 3 🌙",text:"It's late at night and you get a random message. Your reaction?",options:["Reply immediately 👀","See it and reply later 😌","Who is disturbing my sleep? 😂"]},
{title:"Question 4 🎯",text:"Pick the word that fits today's mission:",options:["Mystery 🔮","Memories 💫","Surprise 🎉"]},
{title:"FINAL LOCK 🔓",text:"You've collected every clue. Unlock the final message?",options:["YES — OPEN IT! 🎁","Obviously 😭","Okay, I'm ready ✨"]}
];

let current=-1;
const screen=document.getElementById("screen");

function start(){
screen.innerHTML='<div class="badge">A secret birthday mission</div><h1>🎁 Yashii\'s<br>Birthday Mystery</h1><p>Someone left a little surprise behind.<br>But first… you have to answer a few questions.</p><button class="primary" id="startBtn">START THE MISSION →</button><p class="small">No wrong answers. Probably. 👀</p>';
document.getElementById("startBtn").addEventListener("click",next);
}

function next(){
current++;
if(current>=questions.length){reveal();return;}
const q=questions[current];
screen.innerHTML='<div class="progress"><div class="bar" style="width:'+((current)/questions.length*100)+'%"></div></div><div class="badge">'+q.title+'</div><h2>'+q.text+'</h2><div id="choices"></div><p class="small">Question '+(current+1)+' of '+questions.length+'</p>';
const choices=document.getElementById("choices");
q.options.forEach((x,i)=>{
const b=document.createElement("button");
b.textContent=x;
b.addEventListener("click",()=>choose(i));
choices.appendChild(b);
});
}

function choose(i){
screen.innerHTML='<div class="badge">Clue accepted ✓</div><h2>'+["Interesting choice… 👀","Noted… 🔎","The mystery continues… ✨"][i%3]+'</h2><p>One more step has been unlocked.</p><button class="primary" id="continueBtn">CONTINUE →</button>';
document.getElementById("continueBtn").addEventListener("click",next);
}
